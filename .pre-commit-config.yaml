repos:
  - repo: local
    hooks:
      - id: ruff
        name: lint
        entry: uv run ruff check --fix .
        language: system
        types: [python]

      - id: ruff-format
        name: format
        entry: uv run ruff format .
        language: system
        types: [python]

      - id: schema-check
        name: schema-check
        entry: uv run python -m jri.checks.schema
        language: system
        pass_filenames: false

      - id: basedpyright
        name: typing
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: test
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
