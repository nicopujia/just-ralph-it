default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: fast-validation
        name: fast validation
        entry: ./scripts/validate.py --mode fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: smoke-validation
        name: smoke validation
        entry: ./scripts/validate.py --mode smoke
        language: system
        pass_filenames: false
        stages: [pre-push]
