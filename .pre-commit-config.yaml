default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: validate-fast
        name: commit validation (no tests)
        entry: ./scripts/validate.py --mode fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-full
        name: full validation
        entry: ./scripts/validate.py --mode full
        language: system
        pass_filenames: false
        stages: [pre-push]
