repos:
  - repo: local
    hooks:
      - id: ruff
        name: linter
        entry: uv run ruff check --fix .
        language: system
        types: [python]

      - id: ruff-format
        name: formatter
        entry: uv run ruff format .
        language: system
        types: [python]

      - id: ty
        name: type checker
        entry: uv run ty check
        language: system
        pass_filenames: false
        stages: [pre-push]
