repos:
  - repo: local
    hooks:
      - id: ruff
        name: lint
        entry: make lint
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: format
        entry: make format
        language: system
        types: [python]
        pass_filenames: false

      - id: schema-check
        name: schema-check
        entry: make schema-check
        language: system
        pass_filenames: false

      - id: basedpyright
        name: typing
        entry: make typecheck-py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: test
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
