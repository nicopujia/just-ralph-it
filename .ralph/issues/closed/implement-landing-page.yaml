description: "Create the landing page at GET / served via Jinja2 template.\n\n## Route:\
  \ GET / (in app/routers/pages.py)\n- If user is already logged in (valid session\
  \ cookie), redirect to /dashboard.\n- Otherwise, render the landing page template.\n\
  \n## Template: templates/landing.html\nA minimal HTML page with:\n- Title tag: 'Just\
  \ Ralph It'\n- A centered container with:\n  - h1: 'Just Ralph It'\n  - p (NOT h2,\
  \ a regular paragraph): 'Tool to transform your software idea into a very detailed\
  \ plan and let an AI agent build it entirely.'\n  - A link styled as a button pointing\
  \ to /auth/login with text 'Sign in with GitHub'\n- Minimal CSS inline or in a style\
  \ tag in the head. No external CSS framework.\n  - System font stack: -apple-system,\
  \ BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif\n  - Dark background (#0a0a0a),\
  \ light text (#e0e0e0)\n  - Container centered vertically and horizontally\n  -\
  \ Button: simple border, no fill, white text, hover: light fill\n  - Max-width 600px\
  \ for the container\n- No JavaScript needed on this page.\n\n## Template: templates/base.html\n\
  Create a base template that all pages extend:\n- DOCTYPE html, utf-8 charset, viewport\
  \ meta tag\n- Block: title, head, content\n- Common styles in the head: the dark\
  \ theme colors, system font, box-sizing border-box, margin/padding reset."
acceptance_criteria:
- GET / when not logged in renders the landing page with the heading, paragraph, and
  GitHub button.
- GET / when logged in (valid session cookie) redirects to /dashboard.
- The page has a dark background (#0a0a0a) and light text (#e0e0e0).
- The 'Sign in with GitHub' link points to /auth/login.
- The page is centered vertically and horizontally.
- 'The paragraph text is exactly: ''Tool to transform your software idea into a very
  detailed plan and let an AI agent build it entirely.'''
- A base.html template exists and is extended by landing.html.
- No external CSS frameworks or JavaScript libraries are loaded.
