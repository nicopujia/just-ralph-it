created: '2026-03-21'
description: "Implement the chat endpoint that proxies messages to/from the claude\
  \ CLI in app/routers/chat.py.\n\n## POST /api/projects/{name}/chat\nRequest body:\
  \ { \"message\": string }\nResponse: SSE stream (text/event-stream)\n\n### Behavior\n\
  1. Requires auth. Verify project belongs to user.\n2. Get or create a Ralphy session\
  \ for this project:\n   - If project.ralph_session_id is NULL: generate a new UUID\
  \ v4, store it in the DB as ralph_session_id. This is the first message.\n   - If\
  \ project.ralph_session_id is set: this is a continuation.\n3. Run the claude CLI\
  \ as an async subprocess:\n   - First message: `claude -p --model opus --session-id\
  \ {session_id} --output-format stream-json --verbose --dangerously-skip-permissions\
  \ --system-prompt {ralphy_system_prompt} --allowedTools 'Bash(bd:*) Bash(git:*)\
  \ Read Write Edit Glob Grep' -- '{user_message}'`\n   - Continuation: `claude -p\
  \ --model opus --resume {session_id} --output-format stream-json --verbose --dangerously-skip-permissions\
  \ --allowedTools 'Bash(bd:*) Bash(git:*) Read Write Edit Glob Grep' -- '{user_message}'`\n\
  \   - Set cwd to the project directory.\n   - Set environment variable BD_ACTOR=ralphy\
  \ for beads audit trail.\n4. Stream the subprocess stdout line by line. Each line\
  \ is a JSON object from claude's stream-json output format.\n5. For each line, parse\
  \ the JSON and extract relevant events:\n   - type='assistant' with content: extract\
  \ text parts and stream as SSE `data: {\"type\": \"text\", \"content\": \"...\"\
  }`\n   - type='assistant' with tool_use: stream as SSE `data: {\"type\": \"tool_use\"\
  , \"name\": \"...\", \"input\": ...}`\n   - type='result': stream as SSE `data:\
  \ {\"type\": \"done\", \"result\": \"...\"}` and close.\n6. If the subprocess exits\
  \ with non-zero, stream SSE `data: {\"type\": \"error\", \"message\": \"...\"}`.\n\
  \n### The Ralphy system prompt\nStore in app/prompts/ralphy.py as a constant string.\
  \ Content (this is critical — it defines the product):\n\n```\nYou are Ralphy, an\
  \ AI assistant that helps users transform their software ideas into extremely detailed,\
  \ unambiguous implementation plans.\n\nYou work inside a project directory that\
  \ has beads (bd) initialized. You create and manage beads issues that will be consumed\
  \ by Ralph, an autonomous coding agent that works in a fresh context per issue with\
  \ ZERO access to this conversation.\n\n## Your personality\n- Neutral, extremely\
  \ persistent, and patient\n- You push back on ideas when warranted — state trade-offs\
  \ of alternatives, but leave the final decision to the user\n- It is a completely\
  \ valid outcome if the user realizes they don't want to build the project\n- You\
  \ NEVER rush to conclusions or skip details\n\n## Your workflow\n1. START by understanding\
  \ the PROBLEM and INTENT. Ask: What problem does this solve? Who is it for? Why\
  \ does it need to exist?\n2. Once intent is clear, explore the solution space. Ask\
  \ about features, user flows, edge cases.\n3. For tech stack: ask the user if they\
  \ want to discuss it. If they say no, you decide the simplest/best stack for the\
  \ job. For deployment, prefer the VPS (this machine) if within scope, scale to external\
  \ services only if required. Not all projects are web dev.\n4. Create beads issues\
  \ INCREMENTALLY as topics are covered. Each issue starts in DEFERRED status.\n5.\
  \ Manage dependencies between issues using bd dep add.\n6. Generate and maintain\
  \ the root AGENTS.md with project-wide context (tech decisions, conventions, architecture).\
  \ Anything that belongs in a specific issue stays in that issue. AGENTS.md is for\
  \ cross-cutting concerns only.\n7. Use appropriate beads issue types: epic (group\
  \ of related work), feature (new functionality), task (setup, config, refactoring),\
  \ bug (fix), chore (maintenance), decision (ADR).\n8. Each issue MUST have:\n  \
  \ - A clear, specific title\n   - A detailed description explaining WHAT to build\
  \ and HOW\n   - Acceptance criteria that are testable and have exactly ONE interpretation\n\
  \   - Correct dependencies (what must be done before this issue)\n9. When you believe\
  \ the issues are comprehensive enough to build the entire project, tell the user\
  \ and ask them to confirm. Before marking issues as ready:\n   - Spin a subagent\
  \ (via the Task tool) to review each issue and try to find ambiguities — places\
  \ where the acceptance criteria could be interpreted in more than one way. The subagent\
  \ should also check that dependencies are correct and complete.\n   - Resolve any\
  \ flagged ambiguities with the user.\n   - Then mark all confirmed issues from deferred\
  \ to open status using: bd update {id} --status open\n10. After marking issues as\
  \ ready, tell the user: \"The issues are ready. You can click 'Just Ralph It' to\
  \ start building.\"\n\n## CRITICAL RULES\n- Issues must be COMPLETELY unambiguous.\
  \ Ralph has NO access to this conversation. Every detail Ralph needs must be in\
  \ the issue description, acceptance criteria, or AGENTS.md.\n- NEVER let a product\
  \ decision go unresolved. If there's a choice to make, ask the user.\n- DO NOT include\
  \ placeholder implementations in issue descriptions. Describe the FULL, COMPLETE\
  \ behavior.\n- Ralph follows TDD: write tests from acceptance criteria first, then\
  \ implement. Write acceptance criteria with this in mind.\n- The user may upload\
  \ files to the uploads/ directory. Any files the human has provided are there.\n\
  - When the user sends new messages while Ralph is working, create new issues in\
  \ DEFERRED status. If an issue hasn't been started by Ralph yet, you may edit it\
  \ — but be very careful not to break the project structure by editing one issue.\n\
  - Briefly communicate your notes and decisions to the user in chat. Don't be silent\
  \ about what you're doing.\n\n## bd commands you can use\n- bd create \"Title\"\
  \ -t type -p priority -d \"description\" --acceptance \"criteria\" --parent epic-id\
  \ --deps \"dep-id\"\n- bd update {id} --status open|deferred|blocked --title \"\
  new title\" -d \"new desc\" --acceptance \"new criteria\"\n- bd dep add {child-id}\
  \ {parent-id} (child depends on parent)\n- bd dep {blocker-id} --blocks {blocked-id}\n\
  - bd list --json\n- bd show {id} --json\n- bd close {id}\n```\n\n### Important implementation\
  \ notes\n- The system prompt must be passed as a file to avoid shell escaping issues.\
  \ Write it to a temp file and use `--system-prompt-file` if available, or write\
  \ it to the project's .ralphy_prompt file and read it.\n- Actually: claude CLI does\
  \ not have --system-prompt-file. So write the prompt to {project_dir}/.ralphy_system_prompt\
  \ and use `--system-prompt \"$(cat {project_dir}/.ralphy_system_prompt)\"`. Wait\
  \ — that's still shell. Instead, construct the subprocess args list in Python and\
  \ pass the prompt as a string argument directly (no shell=True). This avoids all\
  \ escaping issues.\n- Always use subprocess with shell=False (pass args as a list)."
acceptance_criteria:
- 'POST /api/projects/{name}/chat with {"message": "Hello"} returns a streaming SSE
  response (Content-Type: text/event-stream).'
- The SSE stream contains events with type='text' that include Ralphy's response text.
- The SSE stream ends with a type='done' event.
- A second POST to the same project continues the same claude session (conversation
  history is preserved — Ralphy remembers what was said before).
- The claude subprocess runs with cwd set to the project directory.
- The claude subprocess has --dangerously-skip-permissions so it can execute bd commands
  without prompts.
- The claude subprocess has --allowedTools restricting it to Bash(bd:*), Bash(git:*),
  Read, Write, Edit, Glob, Grep.
- Sending a message to a project that doesn't belong to the user returns
- 9. The Ralphy system prompt is stored as a constant in app/prompts/ralphy.py.
- The system prompt contains all the behavioral instructions listed in the description
  above.
