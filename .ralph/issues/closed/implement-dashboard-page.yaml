description: 'Create the dashboard page at GET /dashboard.


  ## Route: GET /dashboard (in app/routers/pages.py)

  - Requires auth (redirect to / if not logged in).

  - Render the dashboard template.


  ## Template: templates/dashboard.html

  Extends base.html. Contains:


  ### Header

  - ''Just Ralph It'' text (link to /dashboard) on the left

  - User''s GitHub avatar (32x32, rounded) and username on the right, with a ''Logout''
  link to /auth/logout


  ### Content

  - h2: ''Your Projects''

  - A ''New Project'' button (link to /new) — simple bordered button

  - A list of project cards, loaded via JavaScript fetch to GET /api/projects


  ### Project card

  Each project is a div with:

  - Project name (link to /project/{name})

  - Issue count: ''{n} issues''

  - GitHub repo link (external, opens in new tab)

  - Delete button (small, red text) — on click: shows confirm dialog


  ### Delete confirmation

  Use native confirm() dialog. On confirm: fetch DELETE /api/projects/{name}?delete_repo=true,
  remove the card from DOM.


  ### Empty state

  If no projects: ''No projects yet.'' centered, with ''New Project'' button below.


  ### JavaScript

  Vanilla JS only. On load: fetch GET /api/projects and render. Delete handler as
  described.'
acceptance_criteria:
- GET /dashboard when logged in renders the page with header showing user's avatar
  and username.
- GET /dashboard when not logged in redirects to /.
- The page fetches and displays projects with name, issue count, and GitHub link.
- Each project name links to /project/{name}.
- The 'New Project' button links to /new.
- Clicking delete shows confirm dialog and on confirm calls DELETE API and removes
  card.
- When no projects, 'No projects yet.' is displayed.
- Logout link works and redirects to landing page.
- No external JavaScript frameworks — vanilla JS only.
