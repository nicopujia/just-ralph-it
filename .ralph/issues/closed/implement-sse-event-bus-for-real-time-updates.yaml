title: Implement SSE event bus for real-time updates
priority: 0
assignee: ralph
depends_on:
- initialize-python-project-with-fastapi-uvicorn-and-project-structure
created: '2026-03-21'
description: "Create a centralized SSE event bus in app/sse_bus.py that the frontend\
  \ connects to for all real-time updates.\n\n## GET /api/projects/{name}/events (in\
  \ app/routers/sse.py)\n- Requires auth. Verify project belongs to user.\n- Returns\
  \ text/event-stream.\n- The client connects once and receives ALL event types for\
  \ this project:\n  - `issue_update`: an issue was created, updated, or its status\
  \ changed\n  - `agents_md_update`: AGENTS.md was modified\n  - `ralph_stdout`: a\
  \ line of Ralph's output\n  - `ralph_status`: Ralph loop status changed (started,\
  \ stopped, done, crash_recovery)\n  - `notification`: a notification for the user\
  \ (Ralph needs help)\n  - `ralphy_processing`: Ralphy started/finished processing\
  \ (for disabling input)\n\n## app/sse_bus.py\n\n### Class: SSEBus\nA singleton per-project\
  \ event bus.\n\n```python\nclass SSEBus:\n    def __init__(self):\n        self._subscribers:\
  \ dict[int, set[asyncio.Queue]] = {}  # project_id -> set of queues\n    \n    def\
  \ subscribe(self, project_id: int) -> asyncio.Queue:\n        queue = asyncio.Queue(maxsize=100)\n\
  \        self._subscribers.setdefault(project_id, set()).add(queue)\n        return\
  \ queue\n    \n    def unsubscribe(self, project_id: int, queue: asyncio.Queue):\n\
  \        self._subscribers.get(project_id, set()).discard(queue)\n    \n    async\
  \ def publish(self, project_id: int, event_type: str, data: dict):\n        for\
  \ queue in self._subscribers.get(project_id, set()):\n            try:\n       \
  \         queue.put_nowait({\"event\": event_type, \"data\": data})\n          \
  \  except asyncio.QueueFull:\n                pass  # Drop old events if client\
  \ is slow\n\nsse_bus = SSEBus()  # Singleton\n```\n\n### SSE endpoint implementation\n\
  ```python\n@router.get('/api/projects/{name}/events')\nasync def project_events(name:\
  \ str, user=Depends(get_current_user)):\n    project = await get_project(user, name)\n\
  \    queue = sse_bus.subscribe(project['id'])\n    \n    async def event_generator():\n\
  \        try:\n            while True:\n                event = await asyncio.wait_for(queue.get(),\
  \ timeout=30)\n                yield f'event: {event[\"event\"]}\\ndata: {json.dumps(event[\"\
  data\"])}\\n\\n'\n        except asyncio.TimeoutError:\n            yield f': keepalive\\\
  n\\n'  # Send keepalive comment\n        except asyncio.CancelledError:\n      \
  \      pass\n        finally:\n            sse_bus.unsubscribe(project['id'], queue)\n\
  \    \n    return StreamingResponse(event_generator(), media_type='text/event-stream')\n\
  ```\n\n### Integration points\n- The RalphLoop publishes ralph_stdout and ralph_status\
  \ events.\n- The chat endpoint publishes ralphy_processing events (start/end).\n\
  - A background polling task publishes issue_update events when bd state changes.\n\
  - The notifications system publishes notification events.\n\n### Background issue\
  \ poller\nCreate a background task that, for each project with an active Ralph loop,\
  \ polls `bd list --json` every 3 seconds and compares with the previous state. If\
  \ any issue's status changed or new issues appeared, publish issue_update events.\
  \ Also poll AGENTS.md content (hash comparison) and publish agents_md_update if\
  \ changed."
acceptance_criteria:
- GET /api/projects/{name}/events returns a text/event-stream response.
- When Ralph publishes a stdout line, connected SSE clients receive it as a ralph_stdout
  event.
- When an issue status changes, connected SSE clients receive an issue_update event.
- When AGENTS.md changes, connected SSE clients receive an agents_md_update event.
- SSE connection sends keepalive comments every 30 seconds to prevent timeout.
- Multiple SSE clients can connect to the same project and all receive the same events.
- Disconnecting a client cleans up the subscription (no memory leak).
- The background poller runs every 3 seconds for projects with active Ralph loops.
- The SSE bus is a singleton — all parts of the app publish to the same instance.
