title: Implement Stripe checkout for per-project billing
type: task
priority: 1
assignee: ralph
parent: stripe-integration-billing
depends_on:
- implement-ralph-loop-subprocess-manager
created: '2026-03-21'
description: "Implement Stripe checkout flow triggered by the 'Just Ralph It' button.\n\
  \n## Flow\n1. User clicks JRI button in the UI.\n2. Frontend calls POST /api/projects/{name}/ralph/checkout.\n\
  3. Backend creates a Stripe Checkout Session.\n4. Backend returns the checkout URL.\n\
  5. Frontend redirects to Stripe.\n6. On success, Stripe redirects to /project/{name}?payment=success.\n\
  7. Backend verifies the payment via webhook or redirect handler, then starts the\
  \ Ralph loop.\n\n## POST /api/projects/{name}/ralph/checkout\n- Requires auth.\n\
  - Check free tier: count user's projects that have stripe_payment_id set. If 0 and\
  \ this project has no payment, this is the free project — skip payment, start Ralph\
  \ directly, return {\"free\": true, \"redirect\": null}.\n- Otherwise: create Stripe\
  \ Checkout Session:\n  - mode: 'payment'\n  - line_items: [{ price_data: { currency:\
  \ 'usd', unit_amount: 2000 (i.e., $20.00), product_data: { name: 'Just Ralph It\
  \ — {project_name}' } }, quantity: 1 }]\n  - success_url: 'https://justralph.it/project/{name}?payment=success&session_id={CHECKOUT_SESSION_ID}'\n\
  \  - cancel_url: 'https://justralph.it/project/{name}?payment=cancel'\n  - client_reference_id:\
  \ str(project_id)\n  - metadata: { user_id: str(user_id), project_name: name }\n\
  - Return {\"free\": false, \"redirect\": checkout_session.url}\n\n## GET /api/projects/{name}/ralph/payment-callback?session_id=...\n\
  - Called when user returns from Stripe success URL.\n- Retrieve the Stripe session\
  \ via stripe.checkout.Session.retrieve(session_id).\n- Verify payment_status ==\
  \ 'paid'.\n- Verify client_reference_id matches the project.\n- Store the session\
  \ ID in projects.stripe_payment_id.\n- Start the Ralph loop.\n- Return 200 {\"status\"\
  : \"started\"}.\n- If payment not confirmed, return 402 {\"error\": \"Payment not\
  \ confirmed\"}.\n\n## Configuration\n- stripe.api_key = STRIPE_SECRET_KEY (set in\
  \ config.py)\n- Note: STRIPE_SECRET_KEY in jri.env currently has a pk_test_ prefix\
  \ which is wrong. The code should use it as-is but log a warning if it starts with\
  \ 'pk_' since that's the publishable key, not the secret key."
acceptance_criteria:
- 'POST /api/projects/{name}/ralph/checkout for the first project (free tier) returns
  {"free": true} and starts Ralph directly.'
- POST /api/projects/{name}/ralph/checkout for subsequent projects returns a Stripe
  checkout URL.
- After successful Stripe payment, GET /api/projects/{name}/ralph/payment-callback
  with valid session_id starts the Ralph loop and stores stripe_payment_id.
- GET payment-callback with an unpaid session returns
- 5. The Stripe checkout session has the correct amount ($20), product name, and redirect
  URLs.
- A warning is logged if STRIPE_SECRET_KEY starts with 'pk_'.
