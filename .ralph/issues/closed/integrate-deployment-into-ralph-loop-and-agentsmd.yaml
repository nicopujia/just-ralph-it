title: Integrate deployment into Ralph loop and AGENTS.md
type: task
priority: 0
assignee: Nicolás Pujia
parent: subdomain-deployment-for-user-projects
depends_on:
- add-deployment-columns-to-projects-table-and-port-allocation
- systemd-unit-management-for-dynamic-app-deployment
- nginx-wildcard-subdomain-routing
created: '2026-03-21'
description: "After Ralph finishes all issues and before the loop ends, deploy the\
  \ project. Also update AGENTS.md template and Ralph's prompt to know about the deployment\
  \ target.\n\nWHAT TO CHANGE:\n\n1. In app/ralph_loop.py, after the loop finishes\
  \ (all issues done, before setting status to idle):\n   - Check if there's a deploy_type\
  \ set on the project\n   - If deploy_type='dynamic': call deploy_dynamic() from\
  \ deploy_manager\n   - If deploy_type='static': call deploy_static() from deploy_manager\n\
  \   - Publish SSE event: ralph_status with status='deployed' and url='{subdomain}.justralph.it'\n\
  \n2. In app/routers/projects.py, update the AGENTS.md template (step 5 in create_project):\n\
  \   Add to the AGENTS.md content:\n   ## Deployment\n   - This project will be deployed\
  \ to: https://{name}.justralph.it\n   - The app MUST listen on host 127.0.0.1 and\
  \ port {port} (read from PORT env var)\n   - For static sites, build output should\
  \ be in dist/, build/, or public/\n\n3. In app/prompts/ralph.py, add a deployment\
  \ rule:\n   - 'The app you build will be deployed to a subdomain of justralph.it.\
  \ Ensure it listens on 127.0.0.1:PORT (the PORT environment variable). For static\
  \ sites, output to dist/ or build/.'\n\n4. In app/prompts/ralphy.py, update to suggest\
  \ subdomain deployment:\n   - In the deployment section, add: 'For web projects,\
  \ the app will be deployed to {project_name}.justralph.it automatically. Mention\
  \ this to the user. The deployment is handled automatically—Ralph just needs to\
  \ ensure the app listens on the PORT environment variable.'\n\n5. In templates/project.html:\n\
  \   - After Ralph finishes (loop_done event), show the deployment URL in the toast:\
  \ 'Your project is live at https://{name}.justralph.it'\n   - Add a link to the\
  \ subdomain in the project header next to the GitHub link"
acceptance_criteria:
- Ralph loop deploys the project after finishing all issues
- AGENTS.md template includes deployment info with port and subdomain
- Ralph's prompt mentions PORT env var requirement
- Ralphy mentions subdomain deployment for web projects
- Frontend shows deployment URL after build completes
- Project header has link to live subdomain
