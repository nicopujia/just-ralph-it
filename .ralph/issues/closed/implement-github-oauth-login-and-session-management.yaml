created: '2026-03-21'
description: "Implement GitHub OAuth in app/routers/auth.py and session middleware.\n\
  \n## OAuth Flow\n\n### GET /auth/login\n1. Generate a random `state` string (32\
  \ hex chars).\n2. Store it in a temporary signed cookie (`oauth_state`, max_age=300\
  \ seconds).\n3. Redirect to: `https://github.com/login/oauth/authorize?client_id={GITHUB_CLIENT_ID}&redirect_uri=https://justralph.it/auth/callback&scope=read:user,user:email&state={state}`\n\
  \n### GET /auth/callback?code=...&state=...\n1. Verify `state` matches the `oauth_state`\
  \ cookie. If not, return 400.\n2. Exchange `code` for access token: POST `https://github.com/login/oauth/access_token`\
  \ with client_id, client_secret, code. Accept: application/json.\n3. Use the access\
  \ token to GET `https://api.github.com/user` (with Authorization: Bearer header).\n\
  4. Upsert the user in SQLite: INSERT OR REPLACE into users table using github_id\
  \ as the unique key. Store github_username, github_name, github_email, github_avatar_url,\
  \ and the access_token (as github_token).\n5. Set a signed cookie `session` containing\
  \ the user's id (integer), using itsdangerous.URLSafeTimedSerializer with SECRET_KEY.\
  \ Max age: 30 days.\n6. Delete the `oauth_state` cookie.\n7. Redirect to /dashboard.\n\
  \n### GET /auth/logout\n1. Delete the `session` cookie.\n2. Redirect to /.\n\n###\
  \ GET /auth/me (JSON API)\n1. Read the `session` cookie, deserialize with itsdangerous\
  \ (max_age=30 days).\n2. Look up the user by id in SQLite.\n3. Return JSON: {id,\
  \ github_username, github_name, github_avatar_url}. \n4. If no valid session, return\
  \ 401.\n\n## Session middleware\nCreate a dependency `get_current_user(request:\
  \ Request) -> dict` in app/auth_utils.py that:\n1. Reads and deserializes the `session`\
  \ cookie.\n2. Queries the user from SQLite.\n3. Returns the user row as a dict.\n\
  4. Raises HTTPException(401) if cookie is missing, expired, or user not found.\n\
  \nAll protected endpoints use `Depends(get_current_user)`.\n\n## HTTP client\nUse\
  \ httpx.AsyncClient for all HTTP calls to GitHub. Create a shared instance in config.py\
  \ or use a lifespan-managed client."
acceptance_criteria:
- Visiting /auth/login in a browser redirects to GitHub's OAuth page with the correct
  client_id and callback URL.
- After authorizing on GitHub, the browser is redirected to /auth/callback, which
  sets a `session` cookie and redirects to /dashboard.
- GET /auth/me returns JSON with the user's GitHub username and avatar URL.
- GET /auth/me without a session cookie returns
- 5. GET /auth/logout deletes the session cookie and redirects to /.
- The user's GitHub token, username, name, email, and avatar URL are stored in the
  SQLite users table.
- Logging in a second time updates the existing user row (upsert), not creating a
  duplicate.
- The session cookie is signed — tampering with it causes a 401 on /auth/me.
