title: Systemd unit management for dynamic app deployment
type: task
priority: 0
assignee: Nicolás Pujia
parent: subdomain-deployment-for-user-projects
depends_on:
- add-deployment-columns-to-projects-table-and-port-allocation
created: '2026-03-21'
description: "Create helper functions that generate and manage systemd user units\
  \ for deployed dynamic web apps.\n\nWHAT TO CREATE in app/deploy_manager.py (new\
  \ file):\n\n1. Function generate_systemd_unit(project_name, project_dir, start_command,\
  \ port, user='nico') -> str:\n   Returns the content of a systemd unit file. Template:\n\
  \   [Unit]\n   Description=JRI deploy: {project_name}\n   After=network.target\n\
  \n   [Service]\n   Type=simple\n   WorkingDirectory={project_dir}\n   ExecStart=/bin/bash\
  \ -c '{start_command}'\n   Environment=PORT={port}\n   Environment=HOST=127.0.0.1\n\
  \   Restart=on-failure\n   RestartSec=5\n\n   [Install]\n   WantedBy=default.target\n\
  \n   The start_command should be wrapped so the app binds to the allocated port.\
  \ Set PORT and HOST env vars so apps can read them.\n\n2. Function deploy_dynamic(project_id,\
  \ project_name, project_dir, start_command, port) -> None:\n   - Write the unit\
  \ file to /etc/systemd/system/jri-{project_name}.service\n   - Run: systemctl daemon-reload\n\
  \   - Run: systemctl enable jri-{project_name}\n   - Run: systemctl start jri-{project_name}\n\
  \   - Update DB: deploy_status = 'running'\n   All commands via asyncio.create_subprocess_exec\
  \ with sudo.\n\n3. Function deploy_static(project_name, project_dir) -> None:\n\
  \   - Detect the static output directory. Check in order: dist/, build/, public/,\
  \ out/, .output/public/, the project dir itself\n   - Create/update a symlink: /var/www/jri-sites/{project_name}\
  \ -> {detected_dir}\n   - Update DB: deploy_status = 'running'\n\n4. Function stop_deploy(project_name,\
  \ deploy_type) -> None:\n   - For dynamic: systemctl stop jri-{project_name}\n \
  \  - For static: remove the symlink\n   - Update DB: deploy_status = 'stopped'\n\
  \n5. Function restart_deploy(project_name) -> None:\n   - systemctl restart jri-{project_name}\n\
  \n6. Function get_deploy_logs(project_name, lines=50) -> str:\n   - journalctl -u\
  \ jri-{project_name} -n {lines} --no-pager\n   - Return stdout as string\n\nAll\
  \ subprocess calls should use asyncio and have 15s timeouts."
acceptance_criteria:
- app/deploy_manager.py exists with all 6 functions
- generate_systemd_unit returns valid unit file content
- deploy_dynamic writes unit file, reloads daemon, starts service
- deploy_static creates symlink to detected static output dir
- stop_deploy stops the service/removes symlink
- get_deploy_logs returns journalctl output
- All subprocess calls are async with timeouts
