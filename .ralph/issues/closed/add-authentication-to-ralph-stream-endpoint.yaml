title: Add authentication to Ralph stream endpoint
type: task
priority: 0
assignee: Nicolás Pujia
parent: security-hardening
created: '2026-03-21'
description: "The Ralph stream endpoint at GET /api/projects/{name}/ralph/stream in\
  \ app/routers/ralph.py (line 173-201) has NO authentication dependency. Anyone who\
  \ knows a project name can stream Ralph's stdout output.\n\nWHAT TO CHANGE in app/routers/ralph.py:\n\
  \n1. Change the endpoint signature (line 174):\n   FROM: async def ralph_stream(name:\
  \ str):\n   TO:   async def ralph_stream(name: str, user: dict = Depends(get_current_user)):\n\
  \n2. Add project ownership check after the function signature:\n   await _get_project(name,\
  \ user)\n\nThis reuses the existing _get_project helper which already verifies user\
  \ ownership."
acceptance_criteria:
- GET /api/projects/{name}/ralph/stream returns 401 without session cookie
- GET /api/projects/{name}/ralph/stream returns 404 if user doesn't own the project
- Authenticated owners can still stream Ralph output
