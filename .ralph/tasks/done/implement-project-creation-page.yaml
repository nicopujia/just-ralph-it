title: Implement project creation page
priority: 0
assignee: ralph
depends_on:
- implement-landing-page
- implement-project-creation-with-github-repo-initialization
created: '2026-03-21'
description: |-
  Create the project creation page at GET /new.

  ## Route: GET /new (in app/routers/pages.py)
  - Requires auth (redirect to / if not logged in).
  - Render the project creation template.

  ## Template: templates/new_project.html
  Extends base.html. Same header as dashboard. Contains:

  ### Content
  - h2: 'New Project'
  - A form with:
    - Label 'Project Name' + text input (name='name'). Validation: alphanumeric + hyphens, 1-100 chars. Show validation inline.
    - Label 'Description' + textarea (name='description', placeholder='What do you want to build?', rows=4).
    - Submit button: 'Create Project'
  - On submit (JavaScript):
    - Prevent default.
    - Validate name client-side (regex: ^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$|^[a-zA-Z0-9]$ for single char).
    - Show a loading state on the button ('Creating...', disabled).
    - POST /api/projects with JSON {name, description}.
    - On success: redirect to /project/{name}.
    - On 400/409: show the error message below the name field.
    - On other errors: show a generic error message.

  ### Styles
  - Form max-width 500px, centered.
  - Input and textarea: full width, dark theme (dark bg, light border, light text).
  - Error messages in red.
acceptance_criteria:
- |-
  GET /new when logged in renders the form with name input, description textarea, and submit button.
- GET /new when not logged in redirects to /.
- |-
  Submitting valid name and description creates the project and redirects to /project/{name}.
- |-
  Submitting an invalid name (e.g., '---') shows an inline validation error without calling the API.
- Submitting a duplicate name shows the 409 error message from the API.
- The submit button shows 'Creating...' and is disabled during the API call.
- The description textarea placeholder is 'What do you want to build?'.
- Form styling matches the dark theme.
