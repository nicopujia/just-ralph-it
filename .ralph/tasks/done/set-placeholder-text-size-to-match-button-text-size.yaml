title: Set placeholder text size to match button text size
priority: 2
assignee: Nicolás Pujia
created: '2026-03-21'
description: |-
  In templates/project.html, the textarea placeholder has font-size: 0.8em (line 256-258) but the buttons (Attach, Send) have font-size: 0.85rem (line 272). The user wants the placeholder text to be the same size as the button text.

  WHAT TO CHANGE in templates/project.html:

  1. Change the placeholder CSS rule (line 256-258):
     FROM: .chat-input-area textarea::placeholder { font-size: 0.8em; }
     TO:   .chat-input-area textarea::placeholder { font-size: 0.85rem; }

  This matches the button font-size exactly.
acceptance_criteria:
- The placeholder text in the chat textarea is the same font-size (0.85rem) as the
  Attach and Send button text
- No other font sizes are affected
