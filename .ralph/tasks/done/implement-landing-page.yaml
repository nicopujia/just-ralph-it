title: Implement landing page
priority: 0
assignee: ralph
depends_on:
- implement-github-oauth-login-and-session-management
created: '2026-03-21'
description: |-
  Create the landing page at GET / served via Jinja2 template.

  ## Route: GET / (in app/routers/pages.py)
  - If user is already logged in (valid session cookie), redirect to /dashboard.
  - Otherwise, render the landing page template.

  ## Template: templates/landing.html
  A minimal HTML page with:
  - Title tag: 'Just Ralph It'
  - A centered container with:
    - h1: 'Just Ralph It'
    - p (NOT h2, a regular paragraph): 'Tool to transform your software idea into a very detailed plan and let an AI agent build it entirely.'
    - A link styled as a button pointing to /auth/login with text 'Sign in with GitHub'
  - Minimal CSS inline or in a style tag in the head. No external CSS framework.
    - System font stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif
    - Dark background (#0a0a0a), light text (#e0e0e0)
    - Container centered vertically and horizontally
    - Button: simple border, no fill, white text, hover: light fill
    - Max-width 600px for the container
  - No JavaScript needed on this page.

  ## Template: templates/base.html
  Create a base template that all pages extend:
  - DOCTYPE html, utf-8 charset, viewport meta tag
  - Block: title, head, content
  - Common styles in the head: the dark theme colors, system font, box-sizing border-box, margin/padding reset.
acceptance_criteria:
- |-
  GET / when not logged in renders the landing page with the heading, paragraph, and GitHub button.
- GET / when logged in (valid session cookie) redirects to /dashboard.
- The page has a dark background (#0a0a0a) and light text (#e0e0e0).
- The 'Sign in with GitHub' link points to /auth/login.
- The page is centered vertically and horizontally.
- |-
  The paragraph text is exactly: 'Tool to transform your software idea into a very detailed plan and let an AI agent build it entirely.'
- A base.html template exists and is extended by landing.html.
- No external CSS frameworks or JavaScript libraries are loaded.
