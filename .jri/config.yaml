# The values below are the ones JRI already uses, and the commented ones are optional.

# Provider every agent sends its model requests to.
llm:
  # Either "openai-subscription", to reuse a ChatGPT subscription through the Codex CLI, or the base
  # URL of any OpenAI-compatible provider, such as https://api.openai.com/v1.
  #
  # The subscription needs the Codex CLI (https://learn.chatgpt.com/docs/codex/cli) to store its
  # credentials in a file, so set `cli_auth_credentials_store = "file"` in ~/.codex/config.toml and
  # run `codex login`.
  provider: openai-subscription

  # Name of the environment variable holding the API key of the provider above. Required unless the
  # provider is "openai-subscription". NEVER put the key itself here: JRI reads it from your shell and
  # from the .env file at the root of your project.
  # api_key: OPENAI_API_KEY

# Web search for the explorer agent, on top of the shell, files, and URLs it always has. Get a key at
# https://brave.com/search/api/.
# brave_search:
  # Name of the environment variable holding the Brave Search LLM Context API key.
  # api_key: BRAVE_SEARCH_API_KEY

# Each agent picks a model available on the provider above. Omit the reasoning effort on models
# without reasoning, and the temperature to let the model pick it; reasoning models reject the
# temperature outright.
agents:
  # Leads the requirements gathering interview. Recommended model type: smart yet relatively fast.
  interviewer:
    # Model ID.
    model: gpt-5.6-sol

    # Reasoning effort: none, minimal, low, medium, high, or xhigh. Setting none turns reasoning off,
    # where omitting this leaves the model its own default.
    reasoning_effort: medium

    # Sampling temperature: 0 is focused and 2 is varied.
    # temperature: 0.2

  # Runs shell commands, reads files, and browses the web on the interviewer's behalf. Recommended
  # model type: low cost, fast and with vision capabilities.
  explorer:
    # Model ID.
    model: gpt-5.6-terra

    # Reasoning effort: none, minimal, low, medium, high, or xhigh. Setting none turns reasoning off,
    # where omitting this leaves the model its own default.
    reasoning_effort: low

    # Sampling temperature: 0 is focused and 2 is varied.
    # temperature: 0.2

  # Turns the interview notes into functional specifications. Recommended model type: as smart as
  # possible.
  functional_analyst:
    # Model ID.
    model: gpt-5.6-sol

    # Reasoning effort: none, minimal, low, medium, high, or xhigh. Setting none turns reasoning off,
    # where omitting this leaves the model its own default.
    reasoning_effort: xhigh

    # Sampling temperature: 0 is focused and 2 is varied.
    # temperature: 0.2

  # Designs the system that satisfies those specifications. Recommended model type: as smart as
  # possible.
  architect:
    # Model ID.
    model: gpt-5.6-sol

    # Reasoning effort: none, minimal, low, medium, high, or xhigh. Setting none turns reasoning off,
    # where omitting this leaves the model its own default.
    reasoning_effort: xhigh

    # Sampling temperature: 0 is focused and 2 is varied.
    # temperature: 0.2

# Diagnostics JRI writes down while it runs.
logging:
  # Minimum logging level: DEBUG, INFO, WARNING, ERROR, or CRITICAL. Logs are saved under .jri/logs/.
  level: INFO
