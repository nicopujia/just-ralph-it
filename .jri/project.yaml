- id: t2
  name: Project implementation
  status: open
  notes:
    n1: The user wants to continue defining the Project implementation milestone for Just Ralph It in the current repository.
    n2: The current repository already implements the project-definition interview, exploration, topic/note graph, terminal UI, and session persistence; implementation execution is the next milestone.
    n3: It is unresolved whether to restore and adopt the detailed Project implementation decisions preserved in local Git history or revisit them.
    n4: The implementation workflow uses `.jri/graph.json` as its source project definition.
    n5: A Functional Analyst LLM reads the project graph and either produces behavioral functional specifications as Markdown files or reports behavioral ambiguities to the Interviewer.
    n6: The Functional Analyst must not produce functional specifications when unresolved behavioral ambiguities need clarification from the user.
    n7: An Architect LLM reads the functional specifications and produces architectural implementation specifications.
    n8: A Ralph loop implements the project based on the functional and architectural specifications.
    n9: The user confirmed the staged graph-to-functional-specs-to-architecture-to-Ralph workflow as the desired baseline.
    n27: JRI must manage Git as part of the project implementation workflow.
    n28: Calling the `just_ralph_it` tool is a workflow point of commitment.
    n29: The exact repository state changes and Git operations implied by each workflow point of commitment remain unresolved.
    n30: Git history is the sole immutable version store for generated specification sets; JRI does not maintain duplicate per-run specification directories.
    n31: The working tree contains only the currently checked-out functional specification files.
    n32: The Git commit containing a successfully generated functional specification set identifies that immutable specification version and its source graph state.
    n33: JRI stores mutable implementation-workflow status and the active specification commit pointer in the existing ignored `.jri/state.json`; durable specification identity and provenance are derived from Git.
    n34: Ralph executes in a dedicated JRI-managed Git worktree under `.jri/worktree/` on an implementation branch.
    n35: A dedicated implementation worktree should omit JRI's ignored runtime artifacts so Ralph sees a simpler repository environment.
    n36: Calling `just_ralph_it` must refuse to proceed when the source repository has unrelated tracked changes or nonignored untracked files; ignored runtime artifacts and JRI-managed project-definition changes do not block dispatch.
    n37: When dispatch is blocked by a dirty repository, the tool output must identify the blocking files so the user can resolve them before retrying.
    n38: Failed Functional Analyst or Architect generation attempts do not create Git commits, preventing ambiguity-resolution loops from producing repetitive checkpoint history.
    n39: The implementation worktree may be deleted and recreated from its implementation branch because Git, not the worktree directory, preserves implementation code and committed artifacts.
    n40: Calling `just_ralph_it` is a logical workflow commitment but does not itself create a Git commit.
    n41: The Architect may reject issues in its functional-specification input and return them to the Functional Analyst for resolution instead of producing architectural specifications.
    n42: Successful architectural specification generation atomically commits both the Architect-accepted functional specifications and the architectural specifications.
    n43: Functional and architectural specifications are committed together only after the Architect accepts the functional specifications and successfully generates the architecture.
    n44: When the Architect reports an issue in the functional specifications, the Functional Analyst first evaluates whether it can resolve the issue under confirmed delegated authority.
    n45: The Functional Analyst may revise functional specifications autonomously in response to Architect feedback only when the required behavioral decision is within confirmed delegated authority.
    n46: If resolving Architect feedback requires a behavioral decision outside confirmed delegated authority, involves contradictory requirements, or presents materially different behavioral alternatives, the Functional Analyst returns the issue to the Interviewer for discussion with the user.
    n47: The Functional Analyst and Architect may iterate over uncommitted draft specifications until the Architect accepts the functional specifications and successfully produces architectural specifications.
    n48: When Architect feedback can be resolved by the Functional Analyst under confirmed delegation, JRI automatically continues the Functional Analyst-to-Architect loop within the same `just_ralph_it` call without involving the Interviewer.
    n49: When Architect feedback requires user input, JRI discards all uncommitted draft specifications, returns the issue to the Interviewer, and restarts the full Functional Analyst and Architect pipeline from the updated graph on the next `just_ralph_it` call.
    n50: The Functional Analyst and Architect should not simply subclass the existing conversational `Agent`; their focused LLM execution should use shared lower-level Responses machinery within the implementation workflow.
    n51: JRI itself orchestrates the loop between the Functional Analyst and Architect rather than allowing either agent to invoke the other directly.
    n52: 'The implementation pipeline is a workflow: predetermined application code controls the sequence and decides the next action at runtime.'
    n53: An agent is distinguished from a workflow by autonomous runtime choice of reasoning steps, tool use, and execution path; JRI should preserve this terminology in its design.
    n54: The Functional Analyst and Architect do not control workflow progression or invoke one another; they perform bounded LLM transformations selected by workflow code.
    n55: JRI should extract reusable low-level LLM Responses streaming and tool-execution machinery from the existing conversational `Agent` rather than adding a second execution model directly to `Agent`.
    n56: The new task-oriented execution abstraction should be named in workflow terms rather than called `TaskAgent`; the exact class boundaries and names remain to be defined.
    n57: The Functional Analyst and Architect do not have tools; JRI supplies each workflow step with all inputs required to produce one typed result.
    n58: The project implementation workflow should live under `src/jri/core/workflows/`.
    n59: After the Functional Analyst produces a valid draft, the implementation workflow invokes the Explorer agent against the implementation worktree before invoking the Architect.
    n60: The user confirmed that Functional Analyst and Architect responsibilities remain separate LLM transformations rather than being combined.
    n61: Architectural direction must be defined once before the Ralph implementation loop begins and remain the stable big-picture guide across Ralph iterations.
    n62: Ralph must not be responsible for defining the initial architecture because its iterative execution assumes that stable architecture already exists.
    n63: The implementation workflow preserves separate Functional Analyst and Architect steps, with behavioral authority isolated from repository-aware architectural design.
    n64: The Architect receives the accepted functional draft, the exact repository baseline identity and tracked file tree, and the Explorer's repository analysis report.
    n65: The Explorer's repository analysis is generated from the implementation worktree state that the resulting architecture will target.
    n66: The Explorer is an autonomous agent invoked at a predetermined point inside the application-controlled implementation workflow.
    n67: 'The Explorer''s repository-analysis report is ephemeral: JRI uses it as Architect input and does not commit it with the functional and architectural specifications.'
    n68: The Explorer report is contextual evidence only; functional specifications remain the behavioral authority and architectural specifications remain the implementation authority.
    n69: The Explorer produces a repository-general analysis rather than tailoring its report to the functional specifications; the Architect combines that general context with the separately supplied functional draft.
    n70: JRI may reuse the ephemeral Explorer report across Functional Analyst–Architect iterations while the analyzed repository baseline remains unchanged.
    n71: How JRI handles updates after an initial specification or implementation cycle remains unresolved; the meaning and scope of an update must be clarified.
    n95: 'The Architect returns a typed terminal outcome: either functional-specification issues for the Functional Analyst or a successful architectural-specification patch whose payload is a standard Git unified diff.'
    n96: Initial architectural-spec generation patches an empty architecture tree, while updates patch the existing accepted architecture tree.
    n97: JRI validates and applies a successful architectural patch in isolated staging, then atomically commits the resulting complete architectural tree together with the staged complete functional-spec tree.
    n98: Committed functional specifications live under `.jri/specs/functional/` as Markdown files.
    n99: Committed architectural specifications live under `.jri/specs/architecture/` as Markdown files.
    n101: The tracked `.jri/specs/` tree is JRI-owned project knowledge and is available to Ralph in the implementation worktree.
    n102: JRI does not create `.jri/specs/manifest.json`; the existing ignored `.jri/state.json` holds mutable workflow state, while Git commits provide durable specification provenance.
- id: t3
  name: Functional specifications
  status: open
  notes:
    n10: Every externally observable behavioral decision must either be specified by the user or covered by an explicit user-approved delegation of decision authority.
    n11: The Interviewer must confirm the scope of delegated behavioral decision authority with the user; it must not infer delegation or apply a default delegation posture.
    n12: The Functional Analyst may resolve routine behavioral ambiguities only within areas for which the user has explicitly delegated decision authority.
    n13: The Functional Analyst must escalate contradictory requirements, materially different behavioral alternatives, and behavioral decisions outside its confirmed delegated authority.
    n14: Every behavioral decision made by the Functional Analyst under delegated authority must be stated explicitly and testably in the functional specifications.
    n15: 'Delegation uses a hybrid model: the Interviewer confirms domain-level decision authority during the interview, while each later ambiguity outside that authority can be either decided by the user or explicitly delegated as a one-off.'
    n16: Domain-level delegation does not authorize the Functional Analyst to resolve materially different behavioral alternatives without escalating them.
    n17: A one-off delegation applies only to the specific behavioral ambiguity for which the user grants it.
    n18: The Functional Analyst must review the entire graph and return every contradiction and behavioral ambiguity it identifies in that pass rather than stopping at the first blocker.
    n19: The Interviewer starts the implementation workflow by calling a `just_ralph_it` tool.
    n20: The `just_ralph_it` tool returns the Functional Analyst's result directly to the Interviewer as its tool output.
    n22: Each Functional Analyst specification set accepted by the Architect is preserved in Git as part of an immutable combined functional-and-architectural specification version.
    n23: JRI tracks at most one functional specification set as current and valid for downstream use.
    n24: When analysis of a changed graph finds blocking ambiguities, the previous functional specification set remains preserved but loses its current valid designation.
    n25: The Architect and Ralph must not consume a functional specification set that is not designated current and valid.
    n26: Successful Functional Analyst generation alone does not create a Git commit; functional specifications become committed only after Architect acceptance and successful architectural specification generation.
- id: t4
  name: Project updates
  status: open
  notes:
    n72: A project update occurs when the user tells the Interviewer something that changes the project-definition graph after prior project work may already have been specified or implemented.
    n73: JRI must determine how a graph-changing user update affects existing functional specifications, architectural specifications, implementation state, and subsequent workflow execution.
    n74: An active Ralph loop is coordinated with candidate graph updates by a deterministic graph-identity check between iterations rather than by semantic update classification.
    n75: The graph may evolve through multiple interview turns before the user and Interviewer agree that the updated definition is complete, so JRI must distinguish work-in-progress definition changes from an accepted update.
    n76: The strategy for translating a completed graph update into successor functional and architectural specifications remains unresolved.
    n77: The user's only responsibility is to share thoughts with the Interviewer in natural language; the user must not manage Ralph, Git, worktrees, specification versions, workflow states, pause controls, or update commands directly.
    n78: JRI and the Interviewer must translate natural-language project discussion into candidate graph updates, acceptance boundaries, specification regeneration, and Ralph lifecycle actions.
    n79: JRI automatically coordinates graph changes and Ralph by ending the loop before the next iteration whenever the current graph identity differs from the active specification bundle's graph identity.
    n80: JRI does not require an Interviewer-to-Ralph next-turn pause mechanism because Ralph independently checks graph identity at iteration boundaries and exits on mismatch.
    n81: The user considers next-turn pause coordination potentially too complex and wants the simplest viable automatic update policy.
    n82: JRI is intended to support unattended operation, including being left running while the user sleeps.
    n83: Before starting each new Ralph iteration, JRI compares the current graph identity with the graph identity associated with Ralph's active specification bundle.
    n84: If the graph identities differ, JRI lets any current Ralph iteration finish but starts no subsequent iteration; the active Ralph loop exits without requiring a pause protocol.
    n85: A stopped Ralph loop does not resume merely because the graph later reverts or changes again.
    n86: Ralph restarts only after a `just_ralph_it` call successfully completes the Functional Analyst, Explorer, and Architect workflow and establishes a new accepted specification bundle.
    n87: The unified Functional Analyst workflow receives the complete current `.jri/graph.json`, its Git diff from the accepted graph baseline, and existing accepted functional specifications if any; this same input model supports initial generation and later updates.
    n88: The proposal aims to make brand-new specification generation and specification updates follow the same workflow logic; its treatment of complete graph context, deletions, ambiguity review, and validation remains to be resolved.
    n89: 'The Functional Analyst returns a typed terminal outcome: either an ambiguity report or a successful specification patch whose payload is a standard Git unified diff.'
    n90: Initial functional-spec generation uses an empty specification tree as its patch baseline, while updates use the existing accepted functional-spec tree; both follow the same patch workflow.
    n91: Before applying a Functional Analyst patch, JRI validates unified-diff syntax, rejects absolute or parent-traversal paths, restricts changes to expected Markdown files under the functional-spec directory, and verifies applicability with Git.
    n92: JRI applies a valid functional-spec patch to isolated uncommitted staging and gives the Architect the complete resulting functional-spec tree rather than only the patch.
    n93: If the Functional Analyst emits a malformed or inapplicable patch, JRI treats it as a technical workflow-generation failure rather than a user-facing behavioral ambiguity.
    n94: When FA or Architect later requires user input, JRI discards the staged patched specifications without committing them.
