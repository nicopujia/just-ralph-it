# Welcome to Just Ralph It!
#
# When asked for an API key, you have to specify the name of the corresponding environment variable,
# and then JRI reads the variables defined at your shell and at the .env file at the root of this
# project, if any.
# That is because this settings file is meant to be committed.

# To start using JRI, you need an LLM inference provider.
#
# Vercel AI Gateway is set as the default one for simplicity—with one key, it gives you access to
# practically all models from all providers. You can get an API key at
# https://vercel.com/d?to=/[team]/~/ai-gateway/api-keys. It is also useful because if you already
# have API keys from other providers, it lets you unify them under a single provider, as it supports
# to Bring Your Own Key (BYOK).
#
# Nevertheless, you can also use any OpenAI-compatible provider of your choice, or even a ChatGPT
# subscription.
llm:
  # Here you can set the base URL of any OpenAI-compatible provider.
  # Or, for a ChatGPT subscription, write `openai-subscription`. For that, you need the Codex CLI
  # (https://learn.chatgpt.com/docs/codex/cli) installed and logged in.
  provider: https://ai-gateway.vercel.sh/v1

  # Name of the environment variable (NOT the key itself!)
  api_key: AI_GATEWAY_API_KEY

# [Optional] Get a key at https://brave.com/search/api/ to add web search support.
# brave_search:
  # Name of the environment variable (NOT the key itself!)
  # api_key: BRAVE_SEARCH_API_KEY

# Each agent can use a different model from the provider above.
agents:
  # Interacts with you and takes notes.
  # Use a smart model with a relatively fast reasoning_effort.
  interviewer:
    # The ID of the model, as the provider writes it.
    model: xai/grok-4.6

    # One of none, minimal, low, medium, high, xhigh, max. Not all models accept all the values.
    reasoning_effort: medium

    # 0 gives predictable output and 2 gives random output. Reasoning models refuse this setting.
    # temperature: 0.75

  # Runs commands, reads files, and browses the web for the interviewer.
  # Use a low-cost and fast model with vision capabilities.
  explorer:
    model: openai/gpt-5.6-luna
    reasoning_effort: low
    # temperature: 0

  # Writes the functional specifications.
  # Use the smartest model that you have.
  functional_analyst:
    model: openai/gpt-5.6-sol
    reasoning_effort: xhigh
    # temperature: 0.2

  # Designs the system.
  # Use the smartest model that you have and, if possible, from a different lab than the
  # functional_analyst.
  architect:
    model: anthropic/claude-opus-5
    reasoning_effort: xhigh
    # temperature: 0.2

# JRI writes the logs in .jri/logs/.
logging:
  # One of DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
