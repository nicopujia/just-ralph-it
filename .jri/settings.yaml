# Welcome to JRI! You can use this file now, with no changes. The values below are the defaults JRI
# uses. The commented lines are optional settings: remove the # to turn one on.

# The provider that every agent sends model requests to.
llm:
  # The base URL of an OpenAI-compatible provider. The default provider supplies the models of many
  # companies with one key. Each agent below can use a different model. Get a key at
  # https://openrouter.ai/keys. You can also add the keys that you have at
  # https://openrouter.ai/settings/integrations.
  #
  # Set this to "openai-subscription" to use a ChatGPT subscription. This option needs the Codex CLI
  # (https://learn.chatgpt.com/docs/codex/cli). Set `cli_auth_credentials_store = "file"` in
  # ~/.codex/settings.toml. Then run `codex login`.
  provider: https://openrouter.ai/api/v1

  # Name of the environment variable that holds the API key for the provider above. This setting is
  # required unless the provider is "openai-subscription". Do not put the key itself here. JRI reads
  # the key from your shell, or from the .env file at the root of your project.
  api_key: OPENROUTER_API_KEY

# Adds web search for the explorer agent. The explorer agent already has the shell, files, and URLs.
# Get an API key at https://brave.com/search/api/.
# brave_search:
  # Name of the environment variable that holds the Brave Search LLM Context API key.
  # api_key: BRAVE_SEARCH_API_KEY

# Each agent uses a model from the provider above. Omit the reasoning effort for models that do not
# support reasoning. Omit the temperature to let the model pick its own value. Reasoning models reject
# the temperature setting.
agents:
  # Leads the requirements-gathering interview. Recommended model type: smart, and fairly fast.
  interviewer:
    # ID of the model.
    model: openai/gpt-5.6-sol

    # Reasoning effort. The values are: none, minimal, low, medium, high, xhigh, and max. The value
    # none turns reasoning off. Omit this setting to let the model pick its own default. Not every
    # model supports every value. A model rejects a value it does not support.
    reasoning_effort: medium

    # Sampling temperature. The value 0 gives focused output. The value 2 gives varied output.
    # temperature: 0.2

  # Runs shell commands, reads files, and browses the web for the interviewer. Recommended model type:
  # low cost, fast, and able to read images.
  explorer:
    # ID of the model.
    model: openai/gpt-5.6-terra

    # Reasoning effort. The values are: none, minimal, low, medium, high, xhigh, and max. The value
    # none turns reasoning off. Omit this setting to let the model pick its own default. Not every
    # model supports every value. A model rejects a value it does not support.
    reasoning_effort: low

    # Sampling temperature. The value 0 gives focused output. The value 2 gives varied output.
    # temperature: 0.2

  # Turns the interview notes into functional specifications. Recommended model type: the smartest
  # model available.
  functional_analyst:
    # ID of the model.
    model: openai/gpt-5.6-sol

    # Reasoning effort. The values are: none, minimal, low, medium, high, xhigh, and max. The value
    # none turns reasoning off. Omit this setting to let the model pick its own default. Not every
    # model supports every value. A model rejects a value it does not support.
    reasoning_effort: xhigh

    # Sampling temperature. The value 0 gives focused output. The value 2 gives varied output.
    # temperature: 0.2

  # Designs the system that meets those specifications. Recommended model type: the smartest model
  # available.
  architect:
    # ID of the model.
    model: openai/gpt-5.6-sol

    # Reasoning effort. The values are: none, minimal, low, medium, high, xhigh, and max. The value
    # none turns reasoning off. Omit this setting to let the model pick its own default. Not every
    # model supports every value. A model rejects a value it does not support.
    reasoning_effort: xhigh

    # Sampling temperature. The value 0 gives focused output. The value 2 gives varied output.
    # temperature: 0.2

# The diagnostic messages that JRI writes while it runs.
logging:
  # Minimum logging level. The values are: DEBUG, INFO, WARNING, ERROR, and CRITICAL. JRI saves logs
  # in the .jri/logs/ directory.
  level: INFO
