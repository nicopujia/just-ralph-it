[project]
name = "jri"
version = "0.1.0"
description = "Just Ralph It: the proper tool around the Ralph Wiggum technique."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
jri = "jri.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "coverage>=7.13.5",
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
markers = [
    "live: tests that call real models",
    "e2e: full-story tests that exercise JRI from intent through validation",
]

[tool.coverage.run]
branch = true
source = ["jri"]

[tool.coverage.report]
show_missing = true

[tool.uv]
package = true

[tool.hatch.build]
exclude = [
    "/.coverage",
    "/coverage.xml",
    "/htmlcov/**",
    "/.pytest_cache/**",
    "/.ruff_cache/**",
    "/.sisyphus/**",
    "/.jri/**",
    "**/.env",
    "**/.env.*",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jri"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.basedpyright]
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "tests", extraPaths = ["src", "."], reportPrivateUsage = false },
    { root = "src" },
]
