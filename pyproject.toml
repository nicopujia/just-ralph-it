[project]
name = "justralph-it"
version = "0.1.0"
description = "CLI for running the Just Ralph It workflow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.25.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
jri = "jri.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]

[tool.pytest.ini_options]
markers = [
    "live: tests that call real OpenCode models",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["jri"]
