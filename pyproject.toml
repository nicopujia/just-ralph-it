[project]
name = "just-ralph-it"
version = "0.1.0"
description = "Easily define your own software project idea and then build entirely by just clicking a button."
readme = "README.md"
authors = [
    { name = "Nicolás Pujia", email = "nico@pujia.ar" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.52",
    "pydantic-ai-slim[openrouter]>=1.106.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "coverage>=7.14.1",
    "pexpect>=4.9.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[project.scripts]
jri = "jri.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jri"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "all"
reportUnusedCallResult = "none"

[tool.ruff]
line-length = 79
indent-width = 4
preview = true
show-fixes = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = []
ignore = [
    "CPY", # skip copyright notices
    "D203", # prefer no blank line before class docstrings
    "D213", # prefer docstring summary line to be on the first line
    "COM812", # let formatter handle missing trailing comma
    "ISC003", # prefer explicit string concatenation so basedpyright can catch accidental implicit concat
    "S404", # allow importing subprocess library
    "S603", # allow running subprocesses
    "S607", # allow PATH lookup for standard project subprocesses
    "D107", # skip __init__ docstrings when class docstring is enough
    "DOC201", # avoid noisy Returns sections for simple functions
    "DOC402", # avoid noisy Yields sections for simple generators
    "DOC501", # avoid noisy Raises sections for CLI exits
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # pytest uses assert statements for test expectations
    "FBT001", # pytest boolean fixtures are dependency names, not API flags
    "B903", # small test fakes do not need dataclass ceremony
    "D105", # test magic methods often mirror protocols
    "PLR2004", # literal values in assertions are readable in tests
    "PLR6301", # test fakes often keep instance-shaped protocol methods
    "PLC1901", # explicit empty-string comparisons can be clearer in tests
    "PLC2801", # test fakes sometimes patch typed attributes through setattr
    "RUF012", # simple fake class attributes are acceptable in tests
    "RUF029", # async test fakes mirror async production interfaces
    "W505", # test docstrings can be a little longer
]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["src"]

[tool.coverage.report]
omit = ["tests/**/*.py"]
skip_covered = true
skip_empty = true
fail_under = 100
