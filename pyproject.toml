[project]
name = "just-ralph-it"
version = "0.1.0"
description = "Easily define your own software project idea and then build entirely by just clicking a button."
readme = "README.md"
authors = [
    { name = "Nicolás Pujia", email = "nico@pujia.ar" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.15.15",
]

[project.scripts]
jri = "jri.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jri"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "all"

[tool.ruff]
line-length = 79
indent-width = 4
preview = true
show-fixes = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = []
ignore = [
    "CPY", # skip copyright notices
    "D203", # prefer no blank line before class docstrings
    "D213", # prefer docstring summary line to be on the first line
    "COM812", # let formatter handle missing trailing comma
    "ISC003", # prefer explicit string concatenation so basedpyright can catch accidental implicit concat
    "S404", # allow importing subprocess library
    "S603", # allow running subprocesses
    "D", # make docstrings optional
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
