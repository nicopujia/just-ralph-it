[project]
name = "jri"
version = "0.1.0"
description = "AI-powered code automation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.9",
    "jinja2==3.1.4",
    "markdown==3.7",
    "stripe==10.0.0",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest",
    "ruff",
    "ty>=0.0.25",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/app/prompts/*.py" = ["E501"]
"src/app/main.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ty]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src"]
