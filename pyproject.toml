[project]
name = "just-ralph-it"
version = "0.1.0"
description = "Easily define your own software project idea and then build entirely by just clicking a button."
readme = "README.md"
authors = [
    { name = "Nicolás Pujia", email = "contact@nicolaspujia.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "openai>=2.41.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "textual>=8.2.7",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.15.15",
    "textual-dev>=1.8.0",
]

[project.scripts]
jri = "jri.frontend.terminal:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jri"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
reportImplicitOverride = "error"

[tool.ruff]
line-length = 120
indent-width = 4
preview = true
show-fixes = true
unsafe-fixes = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = []
ignore = [
    "COM812", # mandatory trailing comma
    "CPY", # skip copyright notices
    "D203", # prefer no blank line before class docstrings
    "D213", # prefer docstring summary line to be on the first line
    "EM101", # allow inline string literals in exceptions
    "EM102", # allow inline f-strings in exceptions
    "EM103", # allow inline .format() or concatenated exception messages
    "ISC003", # prefer explicit string concatenation
    "S404", # allow importing subprocess library
    "S603", # allow running subprocesses
    "TRY003", # allow inline exception messages
    "D", # make docstrings optional
    "T20", # allow debug statements
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
