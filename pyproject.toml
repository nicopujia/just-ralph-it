[project]
name = "just-ralph-it"
version = "0.9.5"
description = "Think through a software project idea, then build it with one click."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nicolás Pujia", email = "contact@nicolaspujia.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "textual>=8.2.7",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://justralph.it"
Repository = "https://github.com/nicopujia/just-ralph-it"
Issues = "https://github.com/nicopujia/just-ralph-it/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
    "textual-dev>=1.8.0",
]

[project.scripts]
jri = "jri.tui:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jri"
source-exclude = ["**/.DS_Store"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportImplicitOverride = "error"

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not contract'"
markers = ["contract: reaches the live endpoint it is the oracle for, so only `./scripts/check.py --contracts` runs it"]

[tool.ruff]
line-length = 120
indent-width = 4
preview = true
show-fixes = true
unsafe-fixes = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = []
ignore = [
    "B901", # allow generator return values consumed through `yield from`
    "C901", # allow complex functions; prefer flat inline logic over helper extraction
    "COM812", # leave trailing commas to the formatter, which drops the magic ones this rule would add
    "CPY", # skip copyright notices
    "D", # make docstrings optional
    "EM101", # allow inline string literals in exceptions
    "EM102", # allow inline f-strings in exceptions
    "EM103", # allow inline .format() or concatenated exception messages
    "PLR0911", # allow many returns; early returns are the house style
    "PLR0912", # allow many branches; prefer flat inline logic
    "PLR0915", # allow many statements; prefer flat inline logic
    "S404", # allow importing subprocess library
    "S603", # allow running subprocesses
    "T20", # allow debug statements
    "TRY003", # allow inline exception messages
]

[tool.ruff.lint.pylint]
max-args = 6 # allow `tool()` to describe a tool without an options object

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # allow asserts
]
