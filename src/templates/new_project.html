{% extends "base.html" %}

{% block title %}New Project | Just Ralph It{% endblock %}

{% block breadcrumb %}
<a href="/">Just Ralph It</a>
<span class="separator">/</span>
<a href="/projects">Projects</a>
<span class="separator">/</span>
<span class="current">New</span>
{% endblock %}

{% block head %}
<style>
    .new-project-container {
        max-width: 500px;
        margin: 4rem auto;
        padding: 0 1rem;
    }
    .new-project-container h2 {
        font-size: 1.8rem;
        margin-bottom: 2rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
        color: var(--text-muted);
    }
    .form-group input[type="text"],
    .form-group textarea {
        width: 100%;
        padding: 0.65rem 0.75rem;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-size: 1rem;
        font-family: inherit;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--border-focus);
    }
    .form-group textarea {
        resize: vertical;
    }
    .field-error {
        color: #ff4444;
        font-size: 0.85rem;
        margin-top: 0.4rem;
        display: none;
    }
    .upgrade-banner {
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
        display: none;
    }
    .upgrade-banner p {
        margin: 0 0 0.75rem 0;
        color: var(--text);
    }
    .upgrade-banner .btn-subscribe {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: var(--accent, #6366f1);
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 0.95rem;
        cursor: pointer;
        text-decoration: none;
    }
    .form-actions {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="new-project-container">
    <h2>New Project</h2>
    <div class="upgrade-banner" id="upgrade-banner">
        <p id="upgrade-msg"></p>
        <button class="btn-subscribe" disabled title="Coming soon">Subscribe ($20/mo)</button>
    </div>
    <form id="new-project-form">
        <div class="form-group">
            <label for="name">Project Name</label>
            <input type="text" id="name" name="name" required>
            <div class="field-error" id="name-error"></div>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="What do you want to build?" rows="4"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Create Project</button>
            <a href="/projects" class="btn-ghost">Cancel</a>
        </div>
    </form>
</div>
<script>
(function() {
    const form = document.getElementById('new-project-form');
    const nameInput = document.getElementById('name');
    const descInput = document.getElementById('description');
    const nameError = document.getElementById('name-error');
    const submitBtn = document.getElementById('submit-btn');
    const NAME_RE = /^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$/;

    function showError(msg) {
        nameError.textContent = msg;
        nameError.style.display = 'block';
    }

    function hideError() {
        nameError.style.display = 'none';
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const name = nameInput.value.trim();
        const description = descInput.value.trim();

        if (!NAME_RE.test(name)) {
            showError('Name must contain only letters, numbers, and hyphens, and start/end with a letter or number.');
            return;
        }

        const allButtons = document.querySelectorAll('button');
        allButtons.forEach(function(btn) { btn.disabled = true; });
        submitBtn.textContent = 'Creating...';
        nameInput.disabled = true;
        descInput.disabled = true;

        try {
            const res = await fetch('/api/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });

            if (res.ok) {
                window.location.href = '/projects/' + encodeURIComponent(name);
                return;
            }

            try {
                const data = await res.json();
                if (res.status === 402 && data.detail && data.detail.upgrade_required) {
                    var banner = document.getElementById('upgrade-banner');
                    document.getElementById('upgrade-msg').textContent = data.detail.detail;
                    banner.style.display = 'block';
                } else {
                    var detail = (typeof data.detail === 'string') ? data.detail : (data.detail && data.detail.detail) || 'Something went wrong. Please try again.';
                    showError(detail);
                }
            } catch (_) {
                showError('Something went wrong. Please try again.');
            }
        } catch (err) {
            showError('Something went wrong. Please try again.');
        }

        allButtons.forEach(function(btn) { btn.disabled = false; });
        submitBtn.textContent = 'Create Project';
        nameInput.disabled = false;
        descInput.disabled = false;
    });
})();
</script>
{% endblock %}
