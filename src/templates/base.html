<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Just Ralph It{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --accent: #FFD700;
            --accent-hover: #e6c200;
            --bg: #0a0a0a;
            --bg-secondary: #111;
            --text: #e0e0e0;
            --text-bright: #fff;
            --text-muted: #ccc;
            --text-dim: #888;
            --text-dimmer: #999;
            --text-faint: #666;
            --card-bg: #1a1a1a;
            --border: #333;
            --border-light: #222;
            --border-focus: #555;
            --input-bg: #1a1a1a;
            --code-bg: #0a0a0a;
            --hover-bg: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb: #333;
            --scrollbar-thumb-hover: #555;
            --tab-bar-bg: #0f0f0f;
            --badge-bg: #222;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --accent: #d4a800;
                --accent-hover: #b89200;
                --bg: #fafafa;
                --bg-secondary: #f0f0f0;
                --text: #1a1a1a;
                --text-bright: #000;
                --text-muted: #444;
                --text-dim: #666;
                --text-dimmer: #777;
                --text-faint: #999;
                --card-bg: #ffffff;
                --border: #ddd;
                --border-light: #e5e5e5;
                --border-focus: #aaa;
                --input-bg: #f5f5f5;
                --code-bg: #f0f0f0;
                --hover-bg: rgba(0, 0, 0, 0.05);
                --scrollbar-thumb: #ccc;
                --scrollbar-thumb-hover: #aaa;
                --tab-bar-bg: #f5f5f5;
                --badge-bg: #e5e5e5;
            }
        }
        .btn-ghost {
            display: inline-block;
            padding: 0.75rem 1rem;
            border: 2px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn-ghost:hover {
            background-color: var(--hover-bg);
            color: var(--text);
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1rem;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn:hover {
            background-color: var(--accent);
            color: var(--bg);
        }
        .btn-primary {
            display: inline-block;
            padding: 0.75rem 1rem;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn-primary:hover {
            background-color: var(--accent);
            color: var(--bg);
        }
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
        }
    </style>
    <style>
        /* ── Shared nav ── */
        .site-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            min-height: 48px;
        }
        .site-nav .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1.05rem;
        }
        .site-nav .breadcrumb a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
        }
        .site-nav .breadcrumb a:hover {
            color: var(--text-bright);
        }
        .site-nav .breadcrumb .separator {
            color: var(--text-dim);
        }
        .site-nav .breadcrumb .current {
            color: var(--text-bright);
            font-weight: 600;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .nav-right img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .nav-right .username {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .nav-right a {
            color: var(--text-dimmer);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .nav-right a:hover {
            color: var(--text-bright);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
    {% block nav %}
    {% if user is defined and user %}
    <nav class="site-nav">
        <div class="breadcrumb">
            {% block breadcrumb %}
            <a href="/">Just Ralph It</a>
            {% endblock %}
        </div>
        <div class="nav-right">
            <img src="{{ user.github_avatar_url }}" alt="Avatar">
            <span class="username">{{ user.github_username }}</span>
            <a href="/auth/logout" onclick="return confirm('Are you sure you want to log out?')">Logout</a>
        </div>
    </nav>
    {% endif %}
    {% endblock %}
    {% block content %}{% endblock %}
</body>
</html>
