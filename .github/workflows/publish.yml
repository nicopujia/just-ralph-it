name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/just-ralph-it
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv python install 3.13
      # The contracts fail rather than skip, so a release cannot pass
      # without this secret, named as `jri chat` names the key it reads.
      - run: ./scripts/check.py --contracts
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv version "${GITHUB_REF_NAME#v}" --frozen
      - run: uv build --no-sources
      - run: uv publish --trusted-publishing always
